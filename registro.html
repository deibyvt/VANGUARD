       CONTENIDO PRINCIPAL — REGISTRO
       Fiel al PDF pág.2: REGISTRATE gigante + 3 campos
       blob oscuro de fondo + modelo decorativa derecha
  ═══════════════════════════════════════════════════ -->
  <main id="contenido-principal"
        style="position: relative; z-index: 10; overflow: hidden;"
        role="main"
        aria-label="Formulario de creación de cuenta">

    <!-- Blob oscuro de fondo -->
    <div class="fondo-formulario__blob" aria-hidden="true"></div>

    <!-- Imagen modelo decorativa — fiel al PDF pág.2 -->
    <div class="imagen-modelo-decorativa" aria-hidden="true">
      <img
        src="https://images.unsplash.com/photo-1617551307578-fd0f4f3734b8?w=600&h=800&fit=crop&crop=top"
        alt=""
        style="
          width: 100%;
          object-fit: contain;
          object-position: top;
          filter: drop-shadow(0 20px 50px rgba(0,0,0,0.55));
        "
      />
    </div>

    <!-- Sección con el formulario -->
    <section id="seccion-formulario-registro"
             style="position: relative; z-index: 20;"
             class="max-w-7xl mx-auto px-6 py-16 lg:py-20"
             aria-labelledby="titulo-pagina-registro">

      <!-- Título gigante — idéntico al PDF pág.2 -->
      <h1 id="titulo-pagina-registro"
          class="font-display text-white leading-none mb-12"
          style="font-size: clamp(4rem, 14vw, 10rem);">
        REGISTRATE
      </h1>

      <!-- ─── FORMULARIO DE REGISTRO ─── -->
      <!--
        3 campos: nombre, correo, contraseña
        Todos con borde rojo, fondo transparente
        Botón ENVÍAR redondeado rojo — fiel al PDF
      -->
      <form id="formulario-registro-usuario"
            class="flex flex-col gap-6 max-w-lg"
            novalidate
            data-tipo-formulario="registro"
            aria-label="Formulario de creación de cuenta VANGUARD">

        <!-- Campo: Nombre completo -->
        <div id="grupo-campo-nombre-registro" class="flex flex-col gap-2">
          <label for="campo-nombre-usuario"
                 class="etiqueta-campo etiqueta-campo--oscura">
            Nombre
          </label>
          <input
            type="text"
            id="campo-nombre-usuario"
            name="nombre-usuario"
            class="campo-formulario"
            placeholder=""
            autocomplete="given-name"
            required
            aria-required="true"
            aria-describedby="error-nombre-usuario"
            data-campo-validar="nombre"
          />
          <p id="error-nombre-usuario"
             class="mensaje-error-campo"
             role="alert"
             aria-live="polite"></p>
        </div>

        <!-- Campo: Correo electrónico -->
        <div id="grupo-campo-correo-registro" class="flex flex-col gap-2">
          <label for="campo-correo-registro"
                 class="etiqueta-campo etiqueta-campo--oscura">
            Correo
          </label>
          <input
            type="email"
            id="campo-correo-registro"
            name="correo-electronico"
            class="campo-formulario"
            placeholder=""
            autocomplete="email"
            required
            aria-required="true"
            aria-describedby="error-correo-registro"
            data-campo-validar="correo"
          />
          <p id="error-correo-registro"
             class="mensaje-error-campo"
             role="alert"
             aria-live="polite"></p>
        </div>

        <!-- Campo: Contraseña nueva -->
        <div id="grupo-campo-contrasena-registro" class="flex flex-col gap-2">
          <label for="campo-contrasena-registro"
                 class="etiqueta-campo etiqueta-campo--oscura">
            contraseña
          </label>
          <input
            type="password"
            id="campo-contrasena-registro"
            name="contrasena-nueva"
            class="campo-formulario"
            placeholder=""
            autocomplete="new-password"
            required
            aria-required="true"
            minlength="8"
            aria-describedby="error-contrasena-registro indicacion-contrasena"
            data-campo-validar="contrasena"
          />
          <!-- Indicación de requisito -->
          <p id="indicacion-contrasena"
             class="font-cuerpo"
             style="font-size: 0.72rem; color: rgba(255,255,255,0.35); margin-top: -0.25rem;">
            Mínimo 8 caracteres
          </p>
          <p id="error-contrasena-registro"
             class="mensaje-error-campo"
             role="alert"
             aria-live="polite"></p>
        </div>

        <!-- Botón de envío -->
        <div id="contenedor-boton-registro" class="mt-2">
          <button type="submit"
                  id="boton-enviar-registro"
                  class="boton-primario px-10 py-3 text-sm"
                  aria-label="Crear mi cuenta en VANGUARD"
                  data-accion-boton="registrar-usuario">
            ENVÍAR
          </button>
        </div>

        <!-- Mensaje de estado general -->
        <p id="mensaje-estado-registro"
           class="mensaje-error-campo"
           role="status"
           aria-live="polite"
           style="font-size: 0.85rem;"></p>

        <!-- Enlace a inicio de sesión -->
        <p class="font-cuerpo text-sm" style="color: rgba(255,255,255,0.5); margin-top: 0.5rem;">
          ¿Ya tienes cuenta?
          <a href="login.html"
             style="color: var(--color-rojo-principal); font-weight: 600;"
             class="hover:underline transition-all">
            Inicia sesión aquí
          </a>
        </p>

      </form>
    </section>

    <!-- Espacio visual inferior -->
    <div style="height: 8rem;" aria-hidden="true"></div>

  <script src="assets/js/vanguard-principal.js" defer></script>

  <script>
    /**
     * VANGUARD — Lógica del formulario de Registro
     * ================================================
     * Endpoint futuro: POST /api/v1/autenticacion/registrar
     * Payload: { nombre: string, correoElectronico: string, contrasenaNueva: string }
     * Respuesta: { exito: true, mensaje: "Cuenta creada correctamente" }
     */

    const formularioRegistroUsuario = document.getElementById('formulario-registro-usuario');
    const botonEnviarRegistro       = document.getElementById('boton-enviar-registro');

    if (formularioRegistroUsuario) {
      formularioRegistroUsuario.addEventListener('submit', async (evento) => {
        evento.preventDefault();

        const valorNombre      = document.getElementById('campo-nombre-usuario').value.trim();
        const valorCorreo      = document.getElementById('campo-correo-registro').value.trim();
        const valorContrasena  = document.getElementById('campo-contrasena-registro').value;

        /* ── Validación ── */
        let formularioEsValido = true;

        if (!valorNombre || valorNombre.length < 2) {
          mostrarErrorCampo('error-nombre-usuario', 'El nombre debe tener al menos 2 caracteres');
          formularioEsValido = false;
        } else { ocultarErrorCampo('error-nombre-usuario'); }

        const expresionRegularCorreo = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!valorCorreo || !expresionRegularCorreo.test(valorCorreo)) {
          mostrarErrorCampo('error-correo-registro', 'Ingresa un correo electrónico válido');
          formularioEsValido = false;
        } else { ocultarErrorCampo('error-correo-registro'); }

        if (!valorContrasena || valorContrasena.length < 8) {
          mostrarErrorCampo('error-contrasena-registro', 'La contraseña debe tener al menos 8 caracteres');
          formularioEsValido = false;
        } else { ocultarErrorCampo('error-contrasena-registro'); }

        if (!formularioEsValido) return;

        /* ── Estado cargando ── */
        botonEnviarRegistro.textContent = 'ENVIANDO';
        botonEnviarRegistro.dataset.estado = 'cargando';

        try {
          /*
           * HOOK API — Descomentar al conectar backend:
           *
           * const respuesta = await fetch(
           *   `${window.Vanguard.config.urlApi}/autenticacion/registrar`,
           *   {
           *     method:  'POST',
           *     headers: { 'Content-Type': 'application/json' },
           *     body: JSON.stringify({
           *       nombre:            valorNombre,
           *       correoElectronico: valorCorreo,
           *       contrasenaNueva:   valorContrasena
           *     })
           *   }
           * );
           * const datos = await respuesta.json();
           * if (datos.exito) {
           *   window.location.href = 'login.html?registro=exitoso';
           * } else {
           *   mostrarErrorCampo('mensaje-estado-registro', datos.mensaje);
           * }
           */

          console.log('[VANGUARD] Registro — datos listos:', {
            nombre:            valorNombre,
            correoElectronico: valorCorreo
          });

          /* Demo visual */
          setTimeout(() => {
            botonEnviarRegistro.textContent = 'ENVÍAR';
            delete botonEnviarRegistro.dataset.estado;
          }, 1200);

        } catch (errorDeRed) {
          console.error('[VANGUARD] Error de red:', errorDeRed);
          mostrarErrorCampo('mensaje-estado-registro', 'Error de conexión. Intenta nuevamente.');
          botonEnviarRegistro.textContent = 'ENVÍAR';
          delete botonEnviarRegistro.dataset.estado;
        }
      });
    }

    function mostrarErrorCampo(idElemento, mensaje) {
      const elemento = document.getElementById(idElemento);
      if (!elemento) return;
      elemento.textContent = mensaje;
      elemento.classList.add('mensaje-error-campo--visible');
    }

    function ocultarErrorCampo(idElemento) {
      const elemento = document.getElementById(idElemento);
      if (!elemento) return;
      elemento.textContent = '';
      elemento.classList.remove('mensaje-error-campo--visible');
    }
  </script>
