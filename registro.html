<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrarme — VANGUARD</title>
  <meta name="description" content="Crea tu cuenta en VANGUARD y accede a los mejores productos." />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/sistema-diseno.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'vng-negro': '#1a1a1a',
            'vng-negro-2': '#2d2d2d',
            'vng-rojo': '#e31e1e',
            'vng-rojo-hover': '#c41818',
            'vng-gris': '#e8e8e8',
            'vng-gris-fondo': '#ececec',
          },
          fontFamily: {
            'display': ['Bebas Neue', 'Arial Black', 'sans-serif'],
            'condensada': ['Barlow Condensed', 'Arial Narrow', 'sans-serif'],
            'cuerpo': ['Barlow', 'Arial', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <style>
    /* Fondo con forma blob orgánica — idéntica al PDF */
    .fondo-registro {
      background: #c8c8c8;
      position: relative;
      min-height: 100vh;
    }

    .blob-formulario {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 30%;
      background: #2a2a2a;
      clip-path: polygon(
        0% 0%,
        100% 0%,
        100% 60%,
        72% 72%,
        55% 82%,
        40% 88%,
        20% 84%,
        5% 73%,
        0% 60%
      );
      z-index: 0;
    }

    /* Imagen modelo flotante en la derecha */
    .imagen-modelo-registro {
      position: absolute;
      bottom: 28%;
      right: 0;
      width: 42%;
      max-width: 420px;
      z-index: 5;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .imagen-modelo-registro {
        display: none;
      }
      .blob-formulario {
        bottom: 20%;
      }
    }
  </style>
</head>

<body class="font-cuerpo fondo-registro" id="pagina-registro">

  <!-- ─── NAVBAR ─── -->
  <header id="navbar-principal" class="bg-vng-negro sticky top-0 z-50 w-full" role="banner">
    <nav class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4">
      <a href="index.html" class="font-display text-white text-2xl tracking-widest hover:text-vng-rojo transition-colors" aria-label="VANGUARD — Inicio">VNGRD</a>
      <ul class="hidden md:flex items-center gap-8 list-none">

        <a href="login.html" class="font-condensada font-semibold text-white text-sm tracking-widest uppercase hover:text-vng-rojo transition-colors">iniciar sesión</a>
        <a href="registro.html" class="font-condensada font-semibold text-vng-rojo text-sm tracking-widest uppercase" aria-current="page">registrarme</a>
      </div>
      <button id="boton-menu-movil" class="md:hidden text-white p-2" aria-label="Menú móvil">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </nav>
    <div id="menu-movil" class="md:hidden hidden bg-vng-negro-2 border-t border-gray-700">
      <ul class="flex flex-col py-4 px-6 gap-4 list-none">
        <li><a href="index.html" class="font-condensada text-white tracking-widest uppercase text-sm">Inicio</a></li>

        <li><a href="login.html" class="font-condensada text-white tracking-widest uppercase text-sm">Iniciar Sesión</a></li>
        <li><a href="registro.html" class="font-condensada text-vng-rojo tracking-widest uppercase text-sm">Registrarme</a></li>
      </ul>
    </div>
  </header>


  <!-- ─── CONTENIDO PRINCIPAL ─── -->
  <main id="contenido-principal" class="relative z-10" role="main">

    <!-- Blob oscuro de fondo -->
    <div class="blob-formulario" aria-hidden="true"></div>

    <!-- Imagen modelo decorativa -->
    <div class="imagen-modelo-registro" aria-hidden="true">
      <img
        src="https://images.unsplash.com/photo-1617551307578-fd0f4f3734b8?w=500&h=700&fit=crop&crop=top"
        alt=""
        class="w-full object-contain"
        style="filter: drop-shadow(0 20px 40px rgba(0,0,0,0.5));"
      />
    </div>

    <!-- Sección formulario de registro -->
    <section
      id="seccion-registro"
      class="relative z-20 max-w-7xl mx-auto px-6 py-16 lg:py-20"
      aria-labelledby="titulo-registro"
    >

      <!-- Título gigante REGISTRATE -->
      <h1
        id="titulo-registro"
        class="font-display text-white leading-none mb-12"
        style="font-size: clamp(4rem, 14vw, 10rem);"
      >
        REGISTRATE
      </h1>

      <!-- Formulario de registro -->
      <form
        id="formulario-registro"
        class="flex flex-col gap-6 max-w-xl"
        novalidate
        data-formulario="registro"
        aria-label="Formulario de registro de usuario"

        <!-- Hook JS: data-formulario="registro" para futura integración con API -->
      >

        <!-- Campo Nombre -->
        <div class="grupo-campo" role="group" aria-labelledby="label-nombre">
          <label
            id="label-nombre"
            for="campo-nombre"
            class="font-condensada text-white/80 text-sm tracking-wider uppercase block mb-2"
          >
            Nombre
          </label>
          <input
            type="text"
            id="campo-nombre"
            name="nombre"
            class="input-vanguard"
            placeholder=""
            autocomplete="given-name"
            required
            aria-required="true"
            aria-describedby="error-nombre"
            data-validar="nombre"
          />
          <!-- Hook JS: contenedor de error para validación futura -->
          <p id="error-nombre" class="text-vng-rojo text-xs mt-1 hidden" role="alert" aria-live="polite"></p>
        </div>

        <!-- Campo Correo -->
        <div class="grupo-campo" role="group" aria-labelledby="label-correo">
          <label
            id="label-correo"
            for="campo-correo"
            class="font-condensada text-white/80 text-sm tracking-wider uppercase block mb-2"
          >
            Correo
          </label>
          <input
            type="email"
            id="campo-correo"
            name="correo"
            class="input-vanguard"
            placeholder=""
            autocomplete="email"
            required
            aria-required="true"
            aria-describedby="error-correo"
            data-validar="email"
          />
          <p id="error-correo" class="text-vng-rojo text-xs mt-1 hidden" role="alert" aria-live="polite"></p>
        </div>

        <!-- Campo Contraseña -->
        <div class="grupo-campo" role="group" aria-labelledby="label-contrasena">
          <label
            id="label-contrasena"
            for="campo-contrasena"
            class="font-condensada text-white/80 text-sm tracking-wider uppercase block mb-2"
          >
            contraseña
          </label>
          <input
            type="password"
            id="campo-contrasena"
            name="contrasena"
            class="input-vanguard"
            placeholder=""
            autocomplete="new-password"
            required
            aria-required="true"
            aria-describedby="error-contrasena"
            data-validar="password"
            minlength="8"
          />
          <p id="error-contrasena" class="text-vng-rojo text-xs mt-1 hidden" role="alert" aria-live="polite"></p>
        </div>

        <!-- Botón Enviar -->
        <div class="mt-2">
          <button
            type="submit"
            id="boton-registro"
            class="boton-primario text-sm px-8 py-3"
            aria-label="Enviar formulario de registro"
            data-accion="registrar-usuario"
          >
            ENVÍAR
          </button>
        </div>

        <!-- Mensaje de estado general — Hook JS -->
        <p
          id="mensaje-estado-registro"
          class="text-sm hidden"
          role="status"
          aria-live="polite"
        ></p>

        <!-- Link a login -->
        <p class="font-cuerpo text-white/60 text-sm mt-4">
          ¿Ya tienes cuenta?
          <a href="login.html" class="text-vng-rojo hover:text-white transition-colors font-semibold">
            Inicia sesión aquí
          </a>
        </p>

      </form>
    </section>

    <!-- Espaciador para imagen flotante en móvil -->
    <div class="h-24 md:h-48" aria-hidden="true"></div>

  </main>


  <!-- ─── FOOTER ─── -->

          <a href="mailto:info@vanguard.com" class="font-cuerpo text-white/80 text-xs hover:text-white transition-colors">info@vanguard.com</a>
        </address>
      </div>
    </div>
  </footer>

  <script>
    // Toggle menú móvil
    const botonMenu = document.getElementById('boton-menu-movil');
    const menuMovil = document.getElementById('menu-movil');
    if (botonMenu && menuMovil) {
      botonMenu.addEventListener('click', () => {
        menuMovil.classList.toggle('hidden');
        botonMenu.setAttribute('aria-expanded', !menuMovil.classList.contains('hidden'));
      });
    }

    /**
     * HOOK JS: Validación y envío del formulario de registro
     * Preparado para integrar con API REST: POST /api/v1/auth/registro
     *
     * Estructura esperada del payload:
     * { nombre: string, correo: string, contrasena: string }
     *
     * Para activar: descomentar el bloque de fetch y configurar apiUrl
     */
    const formularioRegistro = document.getElementById('formulario-registro');
    if (formularioRegistro) {
      formularioRegistro.addEventListener('submit', async (evento) => {
        evento.preventDefault();

        const nombre = document.getElementById('campo-nombre').value.trim();
        const correo = document.getElementById('campo-correo').value.trim();
        const contrasena = document.getElementById('campo-contrasena').value;

        // Validación básica — expandir con biblioteca de validación futura
        let esValido = true;

        if (!nombre) {
          mostrarError('error-nombre', 'El nombre es requerido');
          esValido = false;
        } else {
          ocultarError('error-nombre');
        }

        if (!correo || !correo.includes('@')) {
          mostrarError('error-correo', 'Ingresa un correo válido');
          esValido = false;
        } else {
          ocultarError('error-correo');
        }

        if (!contrasena || contrasena.length < 8) {
          mostrarError('error-contrasena', 'La contraseña debe tener al menos 8 caracteres');
          esValido = false;
        } else {
          ocultarError('error-contrasena');
        }

        if (!esValido) return;

        // HOOK: Integración futura con backend
        // const respuesta = await fetch(`${window.Vanguard.config.apiUrl}/auth/registro`, {
        //   method: 'POST',
        //   headers: { 'Content-Type': 'application/json' },
        //   body: JSON.stringify({ nombre, correo, contrasena })
        // });
        // const datos = await respuesta.json();
        // if (datos.exito) window.location.href = 'login.html';

        console.log('[VANGUARD] Registro — datos listos para enviar:', { nombre, correo });
      });
    }

    function mostrarError(idElemento, mensaje) {
      const el = document.getElementById(idElemento);
      if (el) { el.textContent = mensaje; el.classList.remove('hidden'); }
    }

    function ocultarError(idElemento) {
      const el = document.getElementById(idElemento);
      if (el) { el.textContent = ''; el.classList.add('hidden'); }
    }

    window.Vanguard = window.Vanguard || { carrito: {}, usuario: {}, config: { apiUrl: '/api/v1' } };
  </script>

</body>
