<!DOCTYPE html>
<html lang="es" data-pagina="iniciar-sesion">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión — VANGUARD</title>
  <meta name="description" content="Accede a tu cuenta VANGUARD y disfruta de todos los beneficios." />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../app/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />


</head>

<body class="font-cuerpo fondo-formulario" id="pagina-inicio-sesion">

  <!-- ═══════════════════════════════════════════════════
       BARRA DE NAVEGACIÓN PRINCIPAL
       Componente idéntico en todas las páginas.
       Usa clases del sistema de diseño (.barra-navegacion__*)
       Hook accesibilidad: aria-current="page" en enlace activo
  ═══════════════════════════════════════════════════ -->
  <header id="cabecera-principal" class="barra-navegacion" role="banner"
          aria-label="Navegación principal VANGUARD">
    <nav id="navegacion-principal" class="barra-navegacion__contenedor"
         aria-label="Menú principal">

      <!-- Logotipo -->
      <div id="columna-logotipo-pie" class="col-span-2 md:col-span-1 flex items-center">
        <a href="inicio.html" class="pie-pagina__logotipo" aria-label="VANGUARD — Inicio">
          <img src="../assets/images/logoBlanco.png" alt="Vanguard" class="h-10 w-auto object-contain" />
        </a>
      </div>

      <!-- Navegación desktop -->
      <ul id="lista-navegacion-desktop"
          class="barra-navegacion__lista-enlaces"
          role="list"
          aria-label="Secciones principales">
        <li>
          <a href="inicio.html"
             class="barra-navegacion__enlace"
             data-enlace-nav="inicio">inicio</a>
        </li>
        <li>
          <a href="categorias.html"
             class="barra-navegacion__enlace"
             data-enlace-nav="categorias">categorías</a>
        </li>
      </ul>

      <!-- Acciones de autenticación + carrito -->
      <div id="acciones-autenticacion"
           class="barra-navegacion__acciones"
           role="group"
           aria-label="Acceso a cuenta">
        <a href="login.html"
           class="barra-navegacion__enlace barra-navegacion__enlace--activo"
           data-enlace-nav="iniciar-sesion"
           aria-current="page">iniciar sesión</a>
        <a href="registro.html"
           class="barra-navegacion__enlace"
           data-enlace-nav="registrarme">registrarme</a>
        <!-- Carrito -->
        <a href="carrito.html" id="enlace-carrito-navbar"
           class="icono-carrito-navbar" aria-label="Ver carrito"
           data-enlace-nav="carrito">
          <svg width="20" height="20" fill="none" stroke="currentColor"
               stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
          <span id="contador-carrito-navbar" class="contador-carrito-navbar js-oculto"
                aria-live="polite">0</span>
        </a>
      </div>

      <!-- Botón hamburguesa mobile -->
      <button id="boton-menu-movil"
              class="barra-navegacion__boton-menu"
              aria-expanded="false"
              aria-controls="menu-movil"
              aria-label="Abrir menú de navegación">
        <svg width="24" height="24" fill="none" stroke="currentColor"
             stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </nav>

    <!-- Menú desplegable mobile -->
    <div id="menu-movil"
         class="menu-movil"
         role="navigation"
         aria-label="Menú navegación móvil">
      <ul class="menu-movil__lista" role="list">
        <li><a href="inicio.html"      class="menu-movil__enlace">Inicio</a></li>
        <li><a href="categorias.html" class="menu-movil__enlace">Categorías</a></li>
        <li>
          <a href="login.html"
             class="menu-movil__enlace"
             style="color: var(--color-rojo-principal);"
             aria-current="page">Iniciar Sesión</a>
        </li>
        <li><a href="registro.html" class="menu-movil__enlace">Registrarme</a></li>
      </ul>
    </div>
  </header>


  <!-- ═══════════════════════════════════════════════════
       CONTENIDO PRINCIPAL — INICIO DE SESIÓN
       Estructura: blob oscuro como fondo + formulario z:20
       Imagen de moto: absoluta, derecha, sobre el gris claro
       Fiel al PDF página 3: título gigante + 2 campos + botón
  ═══════════════════════════════════════════════════ -->
  <main id="contenido-principal"
        style="position: relative; z-index: 10; overflow: hidden;"
        role="main"
        aria-label="Formulario de inicio de sesión">

    <!-- Blob oscuro de fondo -->
    <div class="fondo-formulario__blob" aria-hidden="true"></div>

    <!-- Imagen de moto decorativa — fiel al PDF pág.3 -->
    <div class="imagen-moto-decorativa" aria-hidden="true">
      <img
        src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=800&h=600&fit=crop&crop=center"
        alt=""
        style="
          width: 100%;
          object-fit: contain;
          filter: drop-shadow(0 20px 60px rgba(0,0,0,0.65));
        "
      />
    </div>

    <!-- Sección con el formulario -->
    <section id="seccion-formulario-sesion"
             style="position: relative; z-index: 20;"
             class="max-w-7xl mx-auto px-6 py-16 lg:py-24"
             aria-labelledby="titulo-pagina-inicio-sesion">

      <!-- Título gigante — idéntico al PDF pág.3 -->
      <h1 id="titulo-pagina-inicio-sesion"
          class="font-display text-white leading-none mb-16"
          style="font-size: clamp(3.5rem, 12vw, 8.5rem); max-width: 75%;">
        INICIAR SESIÓN
      </h1>

      <!-- ─── FORMULARIO ─── -->
      <!--
        Decisión técnica:
        - novalidate: usamos validación JS controlada, no nativa del browser
          (más control visual y de mensajes en español)
        - data-tipo-formulario: el script vanguard-principal.js lo consume
          para identificar qué formulario está activo
        - Campos con data-campo-validar: hook para biblioteca de validación futura
      -->
      <form id="formulario-inicio-sesion"
            class="flex flex-col gap-7 max-w-lg"
            novalidate
            data-tipo-formulario="inicio-sesion"
            aria-label="Formulario de acceso a tu cuenta">

        <!-- Grupo campo: Correo electrónico -->
        <div id="grupo-campo-correo-sesion" class="flex flex-col gap-2">
          <label for="campo-correo-sesion"
                 class="etiqueta-campo etiqueta-campo--oscura">
            correo
          </label>
          <input
            type="email"
            id="campo-correo-sesion"
            name="correo-electronico"
            class="campo-formulario"
            placeholder=""
            autocomplete="email"
            required
            aria-required="true"
            aria-describedby="error-correo-sesion"
            data-campo-validar="correo"
          />
          <p id="error-correo-sesion"
             class="mensaje-error-campo"
             role="alert"
             aria-live="polite"></p>
        </div>

        <!-- Grupo campo: Contraseña -->
        <div id="grupo-campo-contrasena-sesion" class="flex flex-col gap-2">
          <label for="campo-contrasena-sesion"
                 class="etiqueta-campo etiqueta-campo--oscura">
            contraseña
          </label>
          <input
            type="password"
            id="campo-contrasena-sesion"
            name="contrasena"
            class="campo-formulario"
            placeholder=""
            autocomplete="current-password"
            required
            aria-required="true"
            aria-describedby="error-contrasena-sesion"
            data-campo-validar="contrasena"
          />
          <p id="error-contrasena-sesion"
             class="mensaje-error-campo"
             role="alert"
             aria-live="polite"></p>
        </div>

        <!-- Botón enviar -->
        <div id="contenedor-boton-sesion" class="mt-2">
          <button type="submit"
                  id="boton-ingresar"
                  class="boton-primario px-10 py-3 text-sm"
                  aria-label="Entrar a mi cuenta VANGUARD"
                  data-accion-boton="iniciar-sesion">
            ENTRAR
          </button>
        </div>

        <!-- Mensaje de estado general — Hook JS lo activa -->
        <p id="mensaje-estado-sesion"
           class="mensaje-error-campo"
           role="status"
           aria-live="polite"
           style="font-size: 0.85rem;"></p>

        <!-- Enlace a registro -->
        <p class="font-cuerpo text-sm" style="color: rgba(255,255,255,0.5); margin-top: 0.5rem;">
          ¿No tienes cuenta?
          <a href="registro.html"
             style="color: var(--color-rojo-principal); font-weight: 600;"
             class="hover:underline transition-all">
            Regístrate aquí
          </a>
        </p>

      </form>
    </section>

    <!-- Espacio visual para que la imagen de moto no choque con el footer -->
    <div style="height: 10rem;" aria-hidden="true"></div>

  </main>


  <!-- ═══════════════════════════════════════════════════
       PIE DE PÁGINA
       Componente reutilizable — idéntico en todas las páginas
       Fondo rojo, 4 columnas: logo / nav / auth / contacto
       position: relative; z-index: 20 para estar sobre el gris
  ═══════════════════════════════════════════════════ -->
  <footer id="pie-pagina"
          class="pie-pagina"
          style="position: relative; z-index: 20;"
          role="contentinfo"
          aria-label="Pie de página VANGUARD">
    <div class="pie-pagina__contenedor">

      <!-- Columna 1: Logotipo -->
      <div id="columna-logotipo-pie" class="col-span-2 md:col-span-1 flex items-center">
        <a href="inicio.html" class="pie-pagina__logotipo" aria-label="VANGUARD — Inicio">
          <img src="../assets/images/logoBlanco.png" alt="Vanguard" class="h-10 w-auto object-contain" />
        </a>
      </div>

      <!-- Columna 2: Navegación principal -->
      <nav id="navegacion-pie-principal" aria-label="Pie: enlaces principales">
        <ul class="pie-pagina__lista-enlaces" role="list">
          <li><a href="inicio.html"      class="pie-pagina__enlace">inicio</a></li>
          <li><a href="categorias.html" class="pie-pagina__enlace">categorías</a></li>
        </ul>
      </nav>

      <!-- Columna 3: Accesos de usuario -->
      <nav id="navegacion-pie-usuario" aria-label="Pie: acceso de usuario">
        <ul class="pie-pagina__lista-enlaces" role="list">
          <li><a href="login.html"    class="pie-pagina__enlace">iniciar sesión</a></li>
          <li><a href="registro.html" class="pie-pagina__enlace">registrarme</a></li>
        </ul>
      </nav>

      <!-- Columna 4: Contacto y redes -->
      <address id="columna-contacto-pie" class="not-italic">
        <p class="pie-pagina__titulo-columna">contáctanos</p>
        <ul class="pie-pagina__redes" role="list" aria-label="Redes sociales de VANGUARD">
          <li>
            <a href="#" class="pie-pagina__icono-red" aria-label="Seguirnos en X (Twitter)">
              <svg width="14" height="14" fill="white" viewBox="0 0 24 24" aria-hidden="true">

              <svg width="14" height="14" fill="white" viewBox="0 0 24 24" aria-hidden="true">

              </svg>
            </a>
          </li>
          <li>

              </svg>
            </a>
          </li>
          <li>
            <a href="#" class="pie-pagina__icono-red" aria-label="Contactarnos por WhatsApp">
              <svg width="14" height="14" fill="white" viewBox="0 0 24 24" aria-hidden="true">

        <a href="mailto:info@vanguard.com" class="pie-pagina__correo">
          info@vanguard.com
        </a>
      </address>

    </div>
  </footer>


  <!-- ═══════════════════════════════════════════════════
       SCRIPTS
       Script base + lógica específica del formulario
  ═══════════════════════════════════════════════════ -->
  <script src="../app/main.js" type="module" defer></script>
  <script src="../app/pages/login.js" defer></script>

</body>
</html>
