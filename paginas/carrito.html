<!DOCTYPE html>
<html lang="es" data-pagina="carrito">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrito de Compras — VANGUARD</title>
  <meta name="description" content="Revisa y gestiona los productos en tu carrito VANGUARD." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../app/tailwind-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../estilos/main.css" />

</head>

<!-- Fondo gris claro — fiel al PDF página 6 -->
<body class="font-cuerpo" style="background:#ececec;min-height:100vh;" id="pagina-carrito">

  <!-- ═══════════════════════════════════════
       BARRA DE NAVEGACIÓN — variante con buscador
  ═══════════════════════════════════════ -->
  <header id="cabecera-carrito" class="barra-navegacion" role="banner">
    <nav id="navegacion-carrito"
         class="flex items-center justify-between px-6 py-3 gap-4 max-w-full">

      <div id="columna-logotipo-pie" class="col-span-2 md:col-span-1 flex items-center">
        <a href="inicio.html" class="pie-pagina__logotipo" aria-label="VANGUARD — Inicio">
          <img src="../recursos/imagenes/logoBlanco.png" alt="Vanguard" class="h-10 w-auto object-contain" />
        </a>
      </div>

      <a href="inicio.html" class="barra-navegacion__enlace hidden md:block flex-shrink-0">
        INICIO
      </a>

      <div class="flex-1 max-w-md relative" role="search">
        <label for="campo-buscar-carrito" class="sr-only">Buscar producto</label>
        <input type="search" id="campo-buscar-carrito" class="buscador-navegacion w-full pr-10"
               placeholder="BUSCAR PRODUCTO" autocomplete="off" />
        <button class="absolute right-3 top-1/2 -translate-y-1/2" style="color:rgba(255,255,255,0.5);"
                aria-label="Buscar">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
               viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
      </div>

      <div id="acciones-autenticacion" class="barra-navegacion__acciones" role="group" aria-label="Acciones de usuario">
        <a href="login.html" class="barra-navegacion__enlace">Iniciar Sesión</a>
        <a href="registro.html" class="barra-navegacion__enlace">Registrarme</a>
      </div>

      <div id="grupo-acciones-barra" class="flex items-center gap-3 flex-shrink-0">
        <a href="categorias.html" class="barra-navegacion__enlace hidden md:block">CATEGORÍAS</a>
        <!-- Carrito activo en esta página — solo ícono sin enlace -->
        <span id="enlace-carrito-navbar"
              class="icono-carrito-navbar"
              aria-label="Carrito de compras (página actual)"
              aria-current="page">
          <svg width="20" height="20" fill="none" stroke="currentColor"
               stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
          <span id="contador-carrito-navbar" class="contador-carrito-navbar js-oculto"
                aria-live="polite">0</span>
        </span>
        <button id="boton-menu-movil" class="barra-navegacion__boton-menu"
                aria-expanded="false" aria-controls="menu-movil" aria-label="Abrir menú">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
               viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round"
               d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </nav>
    <div id="menu-movil" class="menu-movil" role="navigation" aria-label="Menú móvil">
      <ul class="menu-movil__lista" role="list">
        <li><a href="inicio.html"      class="menu-movil__enlace">Inicio</a></li>
        <li><a href="categorias.html" class="menu-movil__enlace">Categorías</a></li>
        <li><a href="login.html"      class="menu-movil__enlace">Iniciar Sesión</a></li>
        <li><a href="registro.html"   class="menu-movil__enlace">Registrarme</a></li>
      </ul>
    </div>
  </header>


  <!-- ═══════════════════════════════════════
       CONTENIDO PRINCIPAL — CARRITO
       Decisión: max-w-4xl centrado, fondo gris
       Tarjetas con borde rojo y radio grande — fiel al PDF
  ═══════════════════════════════════════ -->
  <main id="contenido-carrito"
        class="max-w-4xl mx-auto px-6 py-12"
        role="main"
        aria-label="Carrito de compras">

    <!-- Lista de artículos del carrito -->
    <!-- Hook JS: id="lista-articulos-carrito" para renderizado dinámico
         desde localStorage o API: GET /api/v1/carrito -->
    <section id="lista-articulos-carrito"
             class="flex flex-col gap-6"
             aria-label="Artículos en tu carrito"
             data-seccion="carrito">

      </section>

    </section>

    <!-- Estado carrito vacío — Hook JS: mostrar cuando no haya artículos -->
    <div id="estado-carrito-vacio"
         class="hidden text-center py-20"
         role="status"
         aria-live="polite">
      <p class="font-display text-4xl" style="color:#999;">CARRITO VACÍO</p>
      <p class="font-condensada text-sm mt-3" style="color:#aaa;letter-spacing:.15em;">
        AGREGA PRODUCTOS PARA CONTINUAR
      </p>
      <a href="categorias.html" class="boton-primario mt-6 inline-flex">
        EXPLORAR CATEGORÍAS
      </a>
    </div>

    <!-- Botón IR A PAGAR — alineado a la derecha -->
    <div id="contenedor-boton-pago"
         class="flex justify-end mt-10">
      <a href="pago.html"
         id="boton-ir-a-pagar"
         class="boton-primario text-base px-10 py-4"
         aria-label="Proceder al proceso de pago"
         data-accion-enlace="ir-a-checkout">
        IR A PAGAR
      </a>
    </div>

  </main>


  <!-- ═══════════════════════════════════════
       PIE DE PÁGINA
  ═══════════════════════════════════════ -->
  <footer id="pie-pagina" class="pie-pagina mt-8" role="contentinfo">
    <div class="pie-pagina__contenedor">
      <div id="columna-logotipo-pie" class="col-span-2 md:col-span-1 flex items-center">
        <a href="inicio.html" class="pie-pagina__logotipo" aria-label="VANGUARD — Inicio">
          <img src="../recursos/imagenes/logoBlanco.png" alt="Vanguard" class="h-10 w-auto object-contain" />
        </a>
      </div>
      <nav aria-label="Pie: enlaces principales">
        <ul class="pie-pagina__lista-enlaces" role="list">
          <li><a href="inicio.html"      class="pie-pagina__enlace">inicio</a></li>
          <li><a href="categorias.html" class="pie-pagina__enlace">categorías</a></li>
        </ul>
      </nav>
      <nav aria-label="Pie: acceso usuario">
        <ul class="pie-pagina__lista-enlaces" role="list">
          <li><a href="login.html"    class="pie-pagina__enlace">iniciar sesión</a></li>
          <li><a href="registro.html" class="pie-pagina__enlace">registrarme</a></li>
        </ul>
      </nav>
      <address class="not-italic">
        <p class="pie-pagina__titulo-columna">contáctanos</p>
        <ul class="pie-pagina__redes" role="list">

          <li><a href="#" class="pie-pagina__icono-red" aria-label="TikTok"><svg width="14" height="14" fill="white" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.34 6.34 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.18 8.18 0 004.78 1.52V6.77a4.85 4.85 0 01-1.01-.08z"/></svg></a></li>

        </ul>
        <a href="mailto:info@vanguard.com" class="pie-pagina__correo">info@vanguard.com</a>
      </address>
    </div>
  </footer>

  <script src="../app/main.js" type="module" defer></script>
  <script src="../app/paginas/carrito.js" defer></script>

</body>
</html>
